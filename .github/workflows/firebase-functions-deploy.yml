name: Deploy Firebase Functions
on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/firebase-functions-deploy.yml'
jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm install
        working-directory: ./functions
      - name: Setup Firebase CLI
        run: npm install -g firebase-tools
      - name: Create Functions .env
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
        working-directory: ./functions
      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase_key.json
        run: |
          cat << 'EOF' > /tmp/firebase_key.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF
          firebase deploy --only functions --project st-app-8eb83
